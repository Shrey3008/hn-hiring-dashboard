name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-checks:
    name: Guardrails and eval harness (no API key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Guardrail checks
        run: python scripts/test_guardrails.py
      - name: Eval set is valid (every reference query runs and returns rows)
        run: python scripts/run_evals.py --dry-run
      - name: Eval harness calibration (oracle, saboteur, over-eager fakes)
        run: python scripts/test_eval_harness.py

  model-regression-gate:
    name: LLM eval against saved baseline
    # Calls the Groq API, so it runs only when started by hand from the Actions
    # tab, and only if the GROQ_API_KEY repository secret is set.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the 25-case eval and compare with the baseline
        if: env.GROQ_API_KEY != ''
        run: python scripts/run_evals.py --baseline eval_results/baseline.json --min-accuracy 0.80
      - name: Skipped (no API key)
        if: env.GROQ_API_KEY == ''
        run: echo "GROQ_API_KEY secret is not set, so the model eval was skipped."
